name: Auto Release

on:
  push:
    branches:
      - master
    paths:
      - package.json
  workflow_dispatch:
    inputs:
      version:
        description: "手动补发版本（可选，默认读取 package.json）"
        required: false
        type: string

jobs:
  build-and-publish:
    name: Build agent and publish release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 准备 Node.js（用于读取 package.json 版本）
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 检查 package.json 的 version 是否发生变化
        id: version
        shell: bash
        run: |
          INPUT_VERSION="${{ github.event.inputs.version }}"
          if [ -n "$INPUT_VERSION" ]; then
            CURRENT_VERSION="$INPUT_VERSION"
          else
            CURRENT_VERSION="$(node -p "require('./package.json').version")"
          fi

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "current_version=$CURRENT_VERSION" >> "$GITHUB_OUTPUT"
            echo "tag=v$CURRENT_VERSION" >> "$GITHUB_OUTPUT"
            echo "手动触发补发，发布版本：$CURRENT_VERSION"
            exit 0
          fi

          BEFORE_SHA="${{ github.event.before }}"
          PREV_VERSION=""

          if [ "$BEFORE_SHA" != "0000000000000000000000000000000000000000" ]; then
            PREV_JSON="$(git show "$BEFORE_SHA:package.json" 2>/dev/null || true)"
            if [ -n "$PREV_JSON" ]; then
              PREV_VERSION="$(printf "%s" "$PREV_JSON" | node -e 'let s="";process.stdin.on("data",d=>s+=d);process.stdin.on("end",()=>{try{const v=JSON.parse(s).version;process.stdout.write(v?String(v):"")}catch{process.stdout.write("")}})')"
            fi
          fi

          if [ "$CURRENT_VERSION" != "$PREV_VERSION" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "current_version=$CURRENT_VERSION" >> "$GITHUB_OUTPUT"
            echo "tag=v$CURRENT_VERSION" >> "$GITHUB_OUTPUT"

            echo "检测到 version 变化：$PREV_VERSION -> $CURRENT_VERSION"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "current_version=$CURRENT_VERSION" >> "$GITHUB_OUTPUT"
            echo "version 未变化（$CURRENT_VERSION），后续步骤将跳过"
          fi

      - name: version 未变化，跳过发布
        if: steps.version.outputs.changed != 'true'
        shell: bash
        run: echo "package.json version 未变化，跳过构建与发布"

      - name: 安装 Go
        if: steps.version.outputs.changed == 'true'
        uses: actions/setup-go@v5
        with:
          go-version-file: agent/go.mod
          cache: false

      - name: 构建 agent 打包产物
        if: steps.version.outputs.changed == 'true'
        working-directory: agent
        shell: bash
        run: |
          chmod +x build.sh
          ./build.sh

      - name: 生成 SHA256 校验文件
        if: steps.version.outputs.changed == 'true'
        working-directory: agent/dist
        shell: bash
        run: |
          sha256sum h2o-agent-linux-amd64 > h2o-agent-linux-amd64.sha256
          sha256sum h2o-agent-linux-arm64 > h2o-agent-linux-arm64.sha256
          sha256sum h2o-agent-bundle.tar.gz > h2o-agent-bundle.tar.gz.sha256

      - name: 生成 Release Body
        if: steps.version.outputs.changed == 'true'
        id: release_body
        shell: bash
        run: |
          CURRENT_TAG="${{ steps.version.outputs.tag }}"

          # 获取上一个 tag（排除当前 tag）
          PREV_TAG=$(git tag --sort=-creatordate | grep -v "^${CURRENT_TAG}$" | head -n 1 || true)

          # 构建 changelog
          if [ -n "$PREV_TAG" ]; then
            CHANGELOG=$(git log "${PREV_TAG}..HEAD" --pretty=format:"- %s (%an)" --no-merges)
            HEADER="## 📋 Changes logs"
          else
            CHANGELOG=$(git log --pretty=format:"- %s (%an)" --no-merges -20)
            HEADER="## 📋 Recent Changes"
          fi

          # 写入 body 文件（避免多行变量在 shell 中的转义问题）
          {
            echo "$HEADER"
            echo ""
            if [ -n "$CHANGELOG" ]; then
              echo "$CHANGELOG"
            else
              echo "_No commits found._"
            fi
            echo ""
            echo "---"
            echo ""
            echo '```'
            echo 'docker compose pull && docker compose up -d'
            echo '```'
          } > release_body.md

      - name: 发布到 GitHub Releases
        if: steps.version.outputs.changed == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}

          body_path: release_body.md
          draft: false
          prerelease: false
          generate_release_notes: false
          overwrite_files: true
          files: |
            agent/dist/h2o-agent-linux-amd64
            agent/dist/h2o-agent-linux-arm64
            agent/dist/h2o-agent-bundle.tar.gz
            agent/dist/h2o-agent-linux-amd64.sha256
            agent/dist/h2o-agent-linux-arm64.sha256
            agent/dist/h2o-agent-bundle.tar.gz.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 设置 Docker Buildx
        if: steps.version.outputs.changed == 'true'
        uses: docker/setup-buildx-action@v3

      - name: 登录 Docker Hub
        if: steps.version.outputs.changed == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: 构建并推送 Docker 镜像
        if: steps.version.outputs.changed == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            sipcink/h2o:latest
            sipcink/h2o:${{ steps.version.outputs.tag }}

      - name: 发送 Telegram 通知
        if: steps.version.outputs.changed == 'true'
        shell: bash
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          REPO="${{ github.repository }}"

          if [ -z "$TG_TOKEN" ] || [ -z "$TG_CHAT_ID" ]; then
            echo "Telegram secrets 未配置，跳过通知"
            exit 0
          fi

          # 只提取 changelog 条目（以 - 开头的行），转为 HTML 安全字符
          CHANGELOG=$(grep '^- ' release_body.md | sed 's/&/\&amp;/g; s/</\&lt;/g; s/>/\&gt;/g' | sed 's/^- /• /' || true)

          # 构建消息（用实际换行，Telegram 用 \n 而非 <br>）
          MSG_FILE=$(mktemp)
          {
            echo "🚀 <b>H2O $TAG 已发布</b>"
            echo ""
            if [ -n "$CHANGELOG" ]; then
              echo "$CHANGELOG"
              echo ""
            fi
            echo "📦 <a href=\"https://github.com/$REPO/releases/tag/$TAG\">GitHub Release</a>"
          } > "$MSG_FILE"

          PAYLOAD=$(jq -n --arg chat "$TG_CHAT_ID" --rawfile msg "$MSG_FILE" '{chat_id:$chat,text:$msg,parse_mode:"HTML",disable_web_page_preview:true}')
          rm -f "$MSG_FILE"

          curl -s -X POST "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD"
